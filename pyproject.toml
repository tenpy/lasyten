[project]
name = "lasyten"
dynamic = ["version"]  # set during packaging/build from git description
description = "LASyTen: Linear Algebra with SYmmetric TENsors"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.14"
license = {text = "Apache_v2"}
# authors = [
#     {name = "TeNPy Developer Team"},
#     {name = "LASyTen Developer Team"},
# ]
# maintainers = [
#     {name = "Johannes Hauschild", email="lasyten@johannes-hauschild.de"},
#     ...
# ]
keywords = ["tensor networks", "tensor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    # "Development Status :: 4 - Beta",
    # "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    # "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    # Required: C++ TorchBlockBackend links libtorch. Wheels exclude libtorch*
    # from auditwheel and resolve via the installed torch package (+ RPATH).
    "torch",
]

[project.optional-dependencies]
# users:
io = ["h5py", "tenpy-hdf5"]
# gpu was previously ["torch"]; torch is now a hard dependency (see above)
# dev:
test = ["pytest>=6.0", "sympy", "lasyten[io]"]
lint = ["ruff", "flake8", "flake8-rst-docstrings", "sphinx-lint"]
docbuild = [
    "Sphinx",
    "sphinx-rtd-theme",
    "sphinxcontrib-bibtex",
    "sphinx_copybutton",
    "clang",
    "pybind11-mkdoc",
]
# generates lasyten/_core.pyi at build time via scripts/generate_core_pyi.py
# (nanobind.stubgen + stubgen_patterns.txt; soft-fail if generation fails)
stubs = ["nanobind"]
# bundles
dev = ["lasyten[io, test, lint, docbuild, stubs]"]
all = ["lasyten[io, test, lint, docbuild, stubs]"]


[project.urls]
"Homepage" = "https://github.com/tenpy/lasyten"
"Documentation" = "https://lasyten.readthedocs.io/"
"Source" = "https://github.com/tenpy/lasyten"
"Bug Tracker" = "https://github.com/tenpy/lasyten/issues"


# [project.scripts]
# lasyten-run = "lasyten:console_main"

[build-system]
# torch is required at build time: CMake links against the same libtorch as `import torch`
# pybind11 is not used anymore (it cannot be compiled with Py_LIMITED_API / the Stable ABI).
requires = ["scikit-build-core", "nanobind>=3.0", "numpy>=2.0", "torch", "setuptools-scm"]
build-backend = "scikit_build_core.build"


[tool.scikit-build]
cmake.version = ">=3.15"
# Only print install lines for files that actually changed (hides "-- Up-to-date: ..." spam).
cmake.define.CMAKE_INSTALL_MESSAGE = "LAZY"
cmake.define.BUILD_DOC = {env="BUILD_DOC", default="OFF"}
# Wheel/editable builds do not need ctests (and SKBUILD skips Development.Embed).
cmake.define.BUILD_TESTING = {env="BUILD_TESTING", default="OFF"}
build-dir = "build" # The build directory. Defaults to a temporary directory, but can be set.
cmake.build-type = "Debug"  # TODO: for now setup debug builds - update this once we release!
# Select the editable mode to use. Can be "redirect" (default) or "inplace".
# editable.mode = "inplace"
wheel.packages = ["lasyten"]
# Stable ABI (abi3): ``lasyten._core`` is built with nanobind STABLE_ABI (Py_LIMITED_API 3.12), so one
# ``cp312-abi3`` wheel serves Python >= 3.12 (the project requires >= 3.14). See CMake option
# LASYTEN_STABLE_ABI (silently off for Python < 3.12). Set to "" to build version-specific wheels.
wheel.py-api = "cp312"
sdist.include = ["lasyten/_version.py"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]  # Section required
write_to = "lasyten/_version.py"

#[tool.setuptools.packages.find]
#include = ['lasyten*']


[tool.pytest.ini_options]
filterwarnings = [
    "error",  # consider all unfiltered warnings error. they should be handled or filtered.
    # sympy still calls deprecated mpmath.bitcount; ignore until sympy catches up
    "ignore:bitcount function is deprecated:DeprecationWarning:mpmath",
    # _SU2 is intentionally test-only and warns on every construction
    "ignore:_SU2 is a test-only API:UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "FusionTree: marks tests that use the FusionTreeBackend.",
    "numpy: marks tests that use the numpy block backend.",
    "torch: marks tests that use the torch block backend.",
    "eigen: marks tests that use the Eigen/LAPACK block backend.",
    "example: marks tests as example (deselect with '-m \"not example\"')",
    "deselect_invalid_ChargedTensor_cases: modifies collection. See notes in conftest.py",
]
log_level = "INFO"
log_format = "%(asctime)s %(levelname)-8s %(filename)-16s%(lineno)4d: %(message)s"
testpaths = ["tests"]


# cibuildwheel (issue #326 item 4 / leftover #2): produce cp312-abi3 wheels.
# Build with CPython >= 3.14 (requires-python); scikit-build-core tags abi3 via wheel.py-api.
# Wheel CI (``.github/workflows/publish.yml``) runs on release + workflow_dispatch only
# (micromamba abi3 hosts + cibuildwheel linux/macOS), not on every PR.
# Do not vendor libtorch into the wheel: ``torch`` is a runtime dependency and
# ``_core`` already has RPATH ``$ORIGIN/../torch/lib``. repair commands exclude
# Torch sonames (auditwheel on linux, delocate on macOS).
[tool.cibuildwheel]
build = "cp314-*"
skip = "pp* *-musllinux_* *i686* *win32*"
build-verbosity = 1
# Release wheels (repo default cmake.build-type is Debug for local editable installs).
# BUILD_TESTING=OFF: no Development.Embed / ctest targets in the wheel build.
config-settings = "cmake.build-type=Release cmake.define.BUILD_TESTING=OFF cmake.define.LASYTEN_STABLE_ABI=ON"
# CPU torch: avoid CUDA wheels that need the toolkit at link time.
environment = { PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu" }
test-skip = "*"

[tool.cibuildwheel.linux]
before-all = [
  "yum install -y eigen3-devel lapack-devel openblas-devel hdf5-devel doxygen || dnf install -y eigen3-devel lapack-devel openblas-devel hdf5-devel doxygen",
]
# Eigen3_DIR is set via CIBW_ENVIRONMENT in .github/workflows/publish.yml (FindEigen3 NO_MODULE).
before-build = "pip install torch numpy nanobind scikit-build-core setuptools-scm cmake ninja"
# Exclude Torch sonames: they come from the ``torch`` PyPI/conda package at runtime.
# Bundling them fails (libs not on the linker path) and would bloat the wheel anyway.
# (Must be one string: list values are joined with ``&&``.)
repair-wheel-command = """
  auditwheel repair -w {dest_dir} {wheel} \
    --exclude libtorch.so \
    --exclude libtorch_cpu.so \
    --exclude libtorch_cuda.so \
    --exclude libtorch_python.so \
    --exclude libtorch_global_deps.so \
    --exclude libc10.so \
    --exclude libc10_cuda.so \
    --exclude libshm.so
"""

[tool.cibuildwheel.macos]
archs = ["native"]
before-all = "brew install eigen hdf5 openblas doxygen || true"
before-build = "pip install torch numpy nanobind scikit-build-core setuptools-scm cmake ninja"
# Vendor brew deps (e.g. HDF5); leave Torch to the runtime ``torch`` package (RPATH
# ``$ORIGIN/../torch/lib``). ``--ignore-missing-dependencies`` covers Torch libs that
# delocate cannot copy; ``--exclude`` matches the Linux auditwheel policy.
repair-wheel-command = """
  delocate-wheel --ignore-missing-dependencies --require-archs {delocate_archs} \
    --exclude libtorch --exclude libtorch_cpu --exclude libtorch_python \
    --exclude libc10 --exclude libomp \
    -w {dest_dir} -v {wheel}
"""


[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["scripts/", "**/*.ipynb"]


[tool.ruff.lint.isort]
# CI ruff check does not install the package; pin first-party so I001 matches local.
known-first-party = ["lasyten"]

[tool.ruff.lint]
# Note: we use flake8 to lint docstrings, see .flake8
# Full list of rules: https://docs.astral.sh/ruff/rules/
select = [
    "F",  # Pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort (sort import statements)
    "UP",  # pyupgrade
    "ISC",  # implicit-str-concat
    "LOG",  # logging
    "INP",  # no-pep420 (implicit namespace packages)
    "D",  # pydocstyle
]
ignore = [
    "F403", "F405",  # star imports
    "E741",  # ambiguous variable names like l
    "F541",  # f-string without any placeholders
    "UP015",  # Unnecessary mode argument
    "UP008",  # Use `super()` instead of `super(__class__, self)`
    "D102",  # Missing docstring in public method
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D203",  # We use D211 instead (we put no blank line before class docstring)
    "D213",  # We use D214 instead (our multi-line docs start in the first line)
    "D400",  # First line should end with a period
    "D401",  # First line of docstring should be in imperative mood
    "D415",  # First line should end with a period, question mark, or exclamation point
    "D417",  # Missing argument description
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # imported but unused
	"I",  # keep import order - this is needed to avoid circular imports
    "E402",  # Module level import not at top of file
]
"conftest.py" = [
    "D103",  # Missing docstring in public function
]
"tests/*.py" = [
    "E501",  # line too long
    "F841",  # Local variable is assigned to but never used
    "INP001",  # is part of an implicit namespace package
    "D",  # pydocstyle
]
"docs/*.py" = [
    "INP001",  # is part of an implicit namespace package
]
"toycodes/*.py" = [
    "INP001",  # is part of an implicit namespace package
    "D102",  # missing docstrings
]
"benchmark/*.py" = [
    "INP001",  # is part of an implicit namespace package
    "D",  # pydocstyle
]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
