repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-vcs-permalinks
      - id: check-toml
      - id: check-yaml
        exclude: tfi_cylinder.yaml
      - id: check-json
      - id: check-added-large-files
        # HDF5 IO fixtures under tests/python_tests/tools/data/ are intentionally
        # a few hundred KB once LegPipe / ChargedTensor / HiddenLegTensor are included.
        args: [ --maxkb=1024 ]
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # Run the linter.
      - id: ruff-check
        exclude: ^(scripts/)
        types_or: [ python, pyi ]
        args: [ --fix , --exit-non-zero-on-fix ]
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi ]

  - repo: https://github.com/pycqa/flake8
    rev: '7.3.0'
    hooks:
    - id: flake8
      exclude: ^(tests/|toycodes/)
      additional_dependencies: [flake8-rst-docstrings]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
    - id: clang-format
      exclude: \.ipynb$
  #- repo: https://github.com/Takishima/cmake-pre-commit-hooks
  #  rev: v1.9.6
  #  hooks:
  #    - id: clang-format
  #    # - id: clang-tidy
  #    #   args: [--checks=readability-magic-numbers,--warnings-as-errors=*]
  #    # - id: include-what-you-use
  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: v1.0.0
    hooks:
      - id: sphinx-lint
        args:
          - "-e=all"
          - "--max-line-length=1000"
          - "-d=default-role"
        files: '^docs/.*\.rst$'

  - repo: local
    hooks:
      # Check for forbidden strings in all text files, e.g. FIXME, DONTSHIP
      - id: fixme
        name: FIXME check
        entry: FIXME|DONTSHIP
        language: pygrep
        types: [text]
        # this file needs to include the forbidden patterns, so we need to exclude it.
        exclude: ^(\.pre-commit-config\.yaml|docs/guidelines/code_style.rst|docs/cpp_conversion|scripts/recover_py_comments.py)
      - id: cpp-docstring-indent
        name: C++ docstring indentation
        entry: tests/linting/cpp_docstring_indent.py
        language: unsupported_script
        files: ^pybind/.*\.cpp$
      # Last and most expensive: only runs if earlier hooks passed (fail_fast)
      # and a local editable build/ directory already exists.
      - id: cmake-build
        name: cmake --build build
        language: unsupported_script
        entry: tests/linting/run_local_cmake_build.py
        pass_filenames: false
        always_run: true
      - id: core-stub-parity
        name: check lasyten._core stub parity
        # note: this requires lasyten to be installed
        language: unsupported_script
        entry: scripts/check_core_stub_parity.py
        args: [--generate]
        pass_filenames: false
        always_run: true
      - id: reexport-all-parity
        name: update re-export __all__ lists
        language: unsupported_script
        entry: scripts/generate_reexport_all.py
        pass_filenames: false
        always_run: true
