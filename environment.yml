# usage: conda env create -f environment.yml
# then: pip install --no-build-isolation .

# note: if you want to build docs as well, use docs/environment.yml instead
name: lasyten
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - pip
  - setuptools>=68.0.0
  - pybind11>=3.0  # still needed until public headers drop py:: (convert_nanobind.md Phase 4)
  - nanobind>=3.0
  - eigen  # header-only; Eigen/LAPACK BlockBackend (convert_EigenBlockBackend.md)
  - scikit-build-core
  - setuptools-scm
  - numpy>=2.0
  - scipy
  - openblas
  - cmake
  - cxx-compiler  # conda-forge g++ / libstdc++; must match conda Python (do not use a newer system g++)
  - doxygen  # required: generates pybind/docstrings/ DOC() headers at build time
  - pytorch
  #- xtensor
  #- xtensor-python
  # alteratively use MKL instead of openblas
  # - mkl
  # - mkl-devel
  # - libblas=*=*mkl  # pin BLAS to use MKL
  # Testing
  - pytest>=6.0
  - sympy

  # developer tools
  - ipython
  - ruff
  - flake8
  - flake8-rst-docstrings
  - sphinx-lint

  # building Sphinx docs (doxygen already above for DOC() generation)
  # - sphinx
  # - sphinx_rtd_theme
  # - graphviz
  # - sphinx-copybutton
  # - breathe  # install via pip; conda-forge version seems incompatible

  # I/O
  - hdf5=2.1  # temporary pin to avoid incompatible version
  - h5py=3.16
  - pyyaml
  - toml

  # pip last: packages after a `pip:` block are ignored by conda
  - pip:
    - breathe  # conda-forge version seems incompatible
    - pybind11-stubgen  # optional: generates lasyten/_core.pyi at build time for IDE type hints
